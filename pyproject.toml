[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinycalc"
version = "0.1.0"
description = "A tiny calculator library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
authors = [{ name = "Alan Geirnaert" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/alangnt/tinycalc"

[project.optional.dependencies]
dev = ["pytest"]